[metadata]
name = RepositoryQA
url = https://github.com/Lochindaal/repoQACode
version = 0.1

[options]
packages = find:
install_requires =
    mona
python_requires = >=3.7

[options.extras_require]
runtime =
  flake8-black>=0.3.6
  flake8-isort>=6.0.0
  flake8-quotes>=3.3.2
  flake8>=6.0.0
  psycopg2-binary>=2.9.5
  pyproject-flake8>=6.0.0.post1
  numpy>=1.26.4
  tqdm>=4.66.2
  jsonlines>=4.0.0
  boto3~=1.28.22
  hexbytes~=0.3.1
  web3~=6.8.0
  eth_abi==4.0.0
  botocore~=1.31.22
  deepdiff==6.2.3
  s3transfer~=0.6.2
  matplotlib>=3.7.2
  black>=22.10.0
  platformdirs==2.5.4
  pathspec==0.10.2
  click==8.1.3
  networkx~=3.1
  setuptools>=65.5.0
  build~=0.10.0

test =
    pytest==6.2.4

[pep8]
max-line-length=110
exclude=docs

[flake8]
max-line-length=110
exclude=docs

[isort]
profile=hug
src_paths=isort,test
