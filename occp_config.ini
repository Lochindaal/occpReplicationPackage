NetworkIP = 127.0.0.1
BCBaseAddress = http://127.0.0.1
AbiLocation = ./data/ecs/smart_contract_abi.json
WebSocket = ws://127.0.0.1:10002/ws

[NODES]
Certifiers = 20
Sequencers = 3
Verifiers = 3
PollInterval = 1
WorkerInterval = 2
LazyWorkers = 1
# Specifies how many tasks a lazy worker maliciously fakes
LazyWork = 3
LazyWorkerPercentages = [10, 20, 30, 40]

[LOGGING]
LogName = ecs
LogFile = occp.log
LogDir = ./data/logs

[MALICIOUS]
; 1 = Non-Malicious; 2 = SequenceHashAttack; 3 = ERA
User = 1
Worker = False

[DATA]
ResultBaseDir = ./data/results
LocalResultDir = local
OccpResultDir = occp

[EXPERIMENT]
NumberReruns = 30
; If set to True only the current settings from this config file will be considered (malicious user, ...)
RunSingleTest = False
Steps = [100000000000]
StepsOccp = [1000, 100]
DumpDir = ./data/experiments
ProgramBaseDir = ./data/programs
Programs = ["fibonacci", "fibonacci_iterative_pretty", "lanczos", "spf", "merge_sort", "matrix_mul", "fibonacci_10", "fibonacci_iterative_pretty_10", "lanczos_10", "spf_10", "merge_sort_10", "matrix_mul_10", "fibonacci_100", "fibonacci_iterative_pretty_100", "lanczos_100", "spf_100", "merge_sort_100", "matrix_mul_100", "fibonacci_1000", "fibonacci_iterative_pretty_1000", "lanczos_1000", "spf_1000", "merge_sort_1000", "matrix_mul_1000"]
ProgramsOccp = ["fibonacci", "fibonacci_iterative_pretty", "lanczos", "spf", "merge_sort", "matrix_mul"]
UserRerun = False
IsInformedSteps = False

[STORAGE]
