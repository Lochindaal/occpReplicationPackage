Respond to this review in the same context as before using the following points.
Review: The paper addresses a recently hot topic in computer science: How program executions (tests, scientific computations) can be validated to decide whether they were run in the way and produced the results that were presented. The proposed solution has two main components: A programming platform (MONA language and Mona Interpreter) that allows stopping, saving, reloading and continuing program executions while producing traces; And a blockchain-based algorithm that allows the distributed validation of the executions. The authors provided a Proof of Concept implementation and performed some measurements.

Although the proposed method sounds, I have doubts about its technical feasibility. First, saving the whole (relevant) memory state of the execution would result in a huge amount of data for every halt/resume points of the program. Second, the MONA language selected for the PoC implementation seems to be a "toy" language. Feasibility on real programming languages is still a question (although I think it is feasible for many languages, I'm not sure it is worth). These problems are mentioned in the threats to validity section.

On P3::left::L27-32 in the sentence "Each program expression ..." the authors state that seqid naturally aligns with execution order, which is only true for very simple, sequential programs.

Points:
-  As also suggested by another reviewer we added a subsection stating the assumptions under which our language works.
