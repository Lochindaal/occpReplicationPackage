- Multi-threading or concurrent program this expected sequence still stands as the expected evaluation order. 
- Our current implementation is limited to deterministic and single-threaded programs. We adjusted the paper to explicitly state that our approach cannot yet handle randomness or multi-threading.
We have introduced a new subsection (2.1 Assumptions) that explicitly outlines the assumptions on which our approach is based. This section clarifies key assumptions such as the need for deterministic and sequential (single-threaded) programs.
We have further emphasised the difference between assumptions that apply specifically to the current implementation and those that hold for the general approach. We address these points in the section “Conclusion and future work”.
