The seqId represents the expected semantic ordering of expression evaluations that the interpreter follows to execute the program. In multi-threaded or concurrent programs, this sequence continues to represent the anticipated order of evaluation. Future research could extend support for concurrent evaluations by incorporating a sequentially numbered annotation layer that identifies the thread evaluating a specific block—naturally annotated through the seqId strategy—which indicates the evaluation progress of that thread within its assigned code derivation. This would allow a memory snapshot to evolve, capturing information about all currently running threads at that specific point in time.

Assuming the certification protocol introduced in this work is used, validation can still succeed if the likelihood of reaching a snapshot where the output is altered by a concurrent side effect remains statistically probable within the expected number of retries. In such cases, one of the workers is expected to achieve the intended sequence of execution, provided that the execution is valid and not maliciously manipulated.

This remains true because, in that specific snapshot, all thread-related information—including evaluation progress, as represented by the seqId strategy—is preserved. Consequently, a worker can continue evaluating all threads under the exact same conditions as the original execution. However, this might lead to workers being perceived as malicious, thereby increasing the overall cost of evaluation. To mitigate this, future work may explore implementing a likelihood evaluation strategy that uses a threshold to determine whether a given sequence is plausible.

Overall, the slicing of a sequential program through the snapshotting strategy can be adapted to the snapshotting of non-sequential programs, where the evaluation step reached by each thread is represented by it the seqId of that thread. As a result, the reproducibility of concurrent scenarios is limited to that particular snapshot and does not affect the complexity of verifying prior or subsequent snapshots.


